plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2' // Плагин для Allure
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}


def selenideVersion = "7.9.1"
def junitVersion = "5.10.2"
def allureVersion = "2.25.0"
def appiumVersion = "8.6.0"
def ownerVersion = "1.0.12"
def restAssuredVersion = "5.4.0"

dependencies {

    testImplementation "com.codeborne:selenide-appium:$selenideVersion"
    testImplementation "io.appium:java-client:$appiumVersion"


    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"


    testImplementation "io.qameta.allure:allure-selenide:$allureVersion"
    testImplementation "io.qameta.allure:allure-rest-assured:$allureVersion"


    testImplementation "org.aeonbits.owner:owner:$ownerVersion"


    testImplementation "io.rest-assured:rest-assured:$restAssuredVersion"
}


configurations.all {
    resolutionStrategy {
        force 'org.aspectj:aspectjweaver:1.9.21'
    }
}

test {
    useJUnitPlatform()
    systemProperties(System.getProperties())

    testLogging {
        showStandardStreams = true
    }
}


allure {
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}